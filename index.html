<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Keuangan Pusat & Toko AWW</title>
    <meta name="app-version" content="9.20.0">
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #333; }
        .main-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-nav-btn { flex: 1; background: #e0e0e0; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; font-size: 1rem; text-align: center; }
        .main-nav-btn.active { background: #1565c0; color: white; }
        .slide-section { display: none; }
        .slide-section.active { display: block; }
        .total-card { background: #ff9800; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .total-card h3 { margin: 0; color: white; font-size: 1.1rem; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .vault-card { background: #eef2f5; padding: 15px; border-radius: 6px; border-left: 5px solid #2196F3; position: relative; }
        .vault-card h4 { margin: 0 0 5px 0; color: #555; }
        .vault-card .balance { font-size: 1.2rem; font-weight: bold; color: #2e7d32; margin-bottom: 10px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1.1rem; }
        .btn-primary { background: #2196F3; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; }
        .btn-cancel { background: #9e9e9e; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<!-- KARTU LOGIN PIN UJI COBA (PIN: 123) -->
<div id="loginScreenCard" style="max-width: 400px; margin: 100px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); text-align: center;">
    <h3 style="color: #1565c0; margin-bottom: 5px;">🔓 Uji Coba Akses AWW</h3>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">Masukkan PIN Uji Coba: <b>123</b></p>
    <div style="text-align: left; margin-bottom: 15px;">
        <label>PIN Akses</label>
        <input type="password" id="testPinInput" inputmode="numeric" maxlength="10" placeholder="Ketik 123..." style="text-align: center; letter-spacing: 3px;">
    </div>
    <button type="button" onclick="doDirectLogin()" class="btn-primary">Masuk ke Aplikasi</button>
</div>

<!-- KONTEN UTAMA APLIKASI -->
<div id="appMainContainer" style="display: none;">
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0;">Pencatatan Keuangan Pusat AWW (Mode Uji Coba)</h2>
        <button class="btn-cancel" onclick="doDirectLogout()">Kunci Sesi 🔒</button>
    </div>

    <div class="main-nav">
        <button class="main-nav-btn active" id="navSlide1" onclick="switchSlide(1)">📁 Slide 1: Pencatatan Brankas</button>
        <button class="main-nav-btn" id="navSlide2" onclick="switchSlide(2)">🏪 Slide 2: Rekap Toko</button>
    </div>

    <div class="slide-section active" id="slide1">
        <div class="total-card">
            <h3>Total Saldo Keseluruhan</h3>
            <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;">Rp 0</div>
        </div>
        <div class="card">
            <h3>Saldo & Keamanan Brankas Permen</h3>
            <div class="vault-grid">
                <div class="vault-card">
                    <h4>Brankas Gudang</h4>
                    <div class="balance">Rp 0</div>
                    <div style="font-size: 0.8rem; color: #2e7d32;">Status: Terbuka</div>
                </div>
            </div>
        </div>
    </div>

    <div class="slide-section" id="slide2">
        <div class="card">
            <h3>Ringkasan Omset 5 Titik Toko AWW</h3>
            <p>Halaman rekap toko aktif.</p>
        </div>
    </div>
</div>
</div>

<script>
    const TRIAL_PIN = "123";

    window.onload = function() {
        const status = localStorage.getItem("aww_unlocked_status");
        if (status === "yes") {
            openMainUI();
        } else {
            openLoginUI();
        }

        const inputEl = document.getElementById('testPinInput');
        if (inputEl) {
            inputEl.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') doDirectLogin();
            });
        }
    };

    function doDirectLogin() {
        const inputField = document.getElementById('testPinInput');
        const val = inputField ? inputField.value.trim() : "";
        if (val === TRIAL_PIN) {
            localStorage.setItem("aww_unlocked_status", "yes");
            openMainUI();
        } else {
            alert('PIN Salah! Gunakan PIN: 123');
            if (inputField) {
                inputField.value = '';
                inputField.focus();
            }
        }
    }

    function openMainUI() {
        const loginCard = document.getElementById('loginScreenCard');
        const mainContainer = document.getElementById('appMainContainer');
        if (loginCard) loginCard.style.display = 'none';
        if (mainContainer) mainContainer.style.display = 'block';
    }

    function openLoginUI() {
        const loginCard = document.getElementById('loginScreenCard');
        const mainContainer = document.getElementById('appMainContainer');
        if (loginCard) loginCard.style.display = 'block';
        if (mainContainer) mainContainer.style.display = 'none';
        setTimeout(() => {
            const el = document.getElementById('testPinInput');
            if (el) el.focus();
        }, 100);
    }

    function doDirectLogout() {
        localStorage.removeItem("aww_unlocked_status");
        openLoginUI();
    }

    function switchSlide(slideNum) {
        document.getElementById('slide1').className = slideNum === 1 ? 'slide-section active' : 'slide-section';
        document.getElementById('slide2').className = slideNum === 2 ? 'slide-section active' : 'slide-section';
        document.getElementById('navSlide1').className = slideNum === 1 ? 'main-nav-btn active' : 'main-nav-btn';
        document.getElementById('navSlide2').className = slideNum === 2 ? 'main-nav-btn active' : 'main-nav-btn';
    }
</script>
</body>
</html>
