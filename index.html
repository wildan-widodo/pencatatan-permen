<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Keuangan Pusat & Toko AWW</title>
    <meta name="app-version" content="9.21.0">
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #333; }
        .main-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-nav-btn { flex: 1; background: #e0e0e0; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; font-size: 1rem; text-align: center; }
        .main-nav-btn.active { background: #1565c0; color: white; }
        .slide-section { display: none; }
        .slide-section.active { display: block; }
        .total-card { background: #1565c0; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .total-card h3 { margin: 0; color: white; font-size: 1.1rem; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .vault-card { background: #eef2f5; padding: 15px; border-radius: 6px; border-left: 5px solid #2196F3; position: relative; }
        .vault-card h4 { margin: 0 0 5px 0; color: #555; }
        .vault-card .balance { font-size: 1.2rem; font-weight: bold; color: #2e7d32; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0;">Pencatatan Keuangan Pusat & Toko AWW</h2>
    </div>

    <div class="main-nav">
        <button class="main-nav-btn active" id="navSlide1" onclick="switchSlide(1)">📁 Slide 1: Pencatatan Brankas</button>
        <button class="main-nav-btn" id="navSlide2" onclick="switchSlide(2)">🏪 Slide 2: Rekap Toko</button>
    </div>

    <!-- SLIDE 1 -->
    <div class="slide-section active" id="slide1">
        <div class="total-card">
            <h3>Total Saldo Keseluruhan</h3>
            <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;">Rp 0</div>
        </div>
        <div class="card">
            <h3>Saldo & Keamanan Brankas Permen</h3>
            <div class="vault-grid">
                <div class="vault-card">
                    <h4>Brankas Gudang</h4>
                    <div class="balance">Rp 0</div>
                    <div style="font-size: 0.8rem; color: #2e7d32;">Status: Akses Langsung Aktif</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SLIDE 2 -->
    <div class="slide-section" id="slide2">
        <div class="card">
            <h3>Ringkasan Omset 5 Titik Toko AWW</h3>
            <p>Halaman rekap toko aktif tanpa hambatan login.</p>
        </div>
    </div>
</div>

<script>
    function switchSlide(slideNum) {
        document.getElementById('slide1').className = slideNum === 1 ? 'slide-section active' : 'slide-section';
        document.getElementById('slide2').className = slideNum === 2 ? 'slide-section active' : 'slide-section';
        document.getElementById('navSlide1').className = slideNum === 1 ? 'main-nav-btn active' : 'main-nav-btn';
        document.getElementById('navSlide2').className = slideNum === 2 ? 'main-nav-btn active' : 'main-nav-btn';
    }
</script>
</body>
</html>
